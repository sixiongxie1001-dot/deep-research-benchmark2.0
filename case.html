<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case — DeepResearch Benchmark v3.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<script src="assets/shell.js"></script>
<script>document.write(renderTopbar('browse'));</script>

<main id="root">
  <div style="text-align: center; padding: 80px 0; color: var(--text-muted)">Loading…</div>
</main>

<script>document.write(renderFooter());</script>
<script>document.write(renderCmdK());</script>

<script>
function getParam(n) { return new URLSearchParams(location.search).get(n); }
function md(t) { return t ? marked.parse(t) : '<div style="color: var(--text-faint); font-style: italic">(empty)</div>'; }

const CASE_TABS = [
  { key: 'question', label: 'Question' },
  { key: 'leaderboard', label: 'Results' },
  { key: 'heatmap', label: 'Per-Q heatmap' },
  { key: 'answers', label: 'Model answer' },
  { key: 'compare', label: 'Compare two' },
  { key: 'reference', label: 'Reference' },
  { key: 'rubric', label: 'Rubric' },
  { key: 'try', label: 'Try yourself' },
];

let DATA = null;

function renderHero(d) {
  const scored = d.models.filter(m => m.overall_pct != null);
  const avg = scored.length ? scored.reduce((a, m) => a + m.overall_pct, 0) / scored.length : null;
  const passN = scored.filter(m => m.overall_pct >= 20 && m.overall_pct <= 35).length;
  const best = scored.sort((a, b) => b.overall_pct - a.overall_pct)[0];
  return `
    <section class="section" style="padding: 48px 0 24px">
      <div class="container">
        <a href="index.html#browse" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); margin-bottom: 20px">← Back to catalog</a>
        <p class="section-eyebrow">Case · ${d.case_id}</p>
        <h1 style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 16px; color: var(--text)">${d.title || d.domain}</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px">
          ${d.entities.map(e => `<span class="pill pill-neutral">${e}</span>`).join('')}
        </div>
        <div class="stat-row" style="border-radius: 4px; overflow: hidden; border: 1px solid var(--border-faint); border-top: 1px solid var(--border-faint); border-bottom: 1px solid var(--border-faint)">
          <div class="stat-cell">
            <div class="num">${d.entities.length}</div>
            <div class="lbl">Entities</div>
          </div>
          <div class="stat-cell">
            <div class="num">${scored.length}<span class="unit">/9</span></div>
            <div class="lbl">Models graded</div>
          </div>
          <div class="stat-cell">
            <div class="num">${avg != null ? avg.toFixed(2) : '—'}<span class="unit">%</span></div>
            <div class="lbl">Avg across models</div>
          </div>
          <div class="stat-cell">
            <div class="num">${passN}<span class="unit">/9</span></div>
            <div class="lbl">In pass band</div>
          </div>
        </div>
      </div>
    </section>
  `;
}

function showCaseTab(key) {
  const d = DATA;
  const models = d.models;
  const scored = models.filter(m => m.overall_pct != null).sort((a, b) => b.overall_pct - a.overall_pct);
  const qKeys = scored[0] && scored[0].q_scores ? Object.keys(scored[0].q_scores).sort() : [];

  let inner = '';
  if (key === 'question') {
    inner = `<div class="card card-pad-lg"><div class="markdown">${md(d.question)}</div></div>`;
  } else if (key === 'leaderboard') {
    inner = '<div style="display: flex; flex-direction: column; gap: 8px">';
    models.sort((a, b) => (b.overall_pct ?? -1) - (a.overall_pct ?? -1)).forEach((m, i) => {
      const rank = m.overall_pct == null ? '—' : (i + 1).toString().padStart(2, '0');
      const w = m.overall_pct != null ? Math.min(100, (m.overall_pct / 50) * 100).toFixed(1) : 0;
      const inBand = m.overall_pct >= 20 && m.overall_pct <= 35;
      const fillClass = inBand ? 'in-band' : m.overall_pct > 35 ? 'above-band' : 'below-band';
      const passStart = (20 / 50 * 100).toFixed(1);
      const passEnd = (35 / 50 * 100).toFixed(1);
      inner += `<div class="card" style="padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <span class="mono" style="color: var(--text-muted); width: 26px">${rank}</span>
        <a href="model.html?slug=${m.slug}" style="flex: 1; min-width: 140px; font-weight: 500; color: var(--text)">${m.name}</a>
        <div style="flex: 1; max-width: 280px">
          <div class="bandbar" style="height: 10px">
            <div class="bandbar-band" style="left: ${passStart}%; right: ${100 - passEnd}%"></div>
            ${m.overall_pct != null ? `<div class="bandbar-fill ${fillClass}" style="width: ${w}%"></div>` : ''}
          </div>
        </div>
        ${m.overall_pct != null ? `<span class="pill ${scoreClass(m.overall_pct)}" style="min-width: 60px; justify-content: center; padding: 3px 8px">${m.overall_pct.toFixed(2)}%</span>` : '<span style="color: var(--text-faint)">—</span>'}
        ${m.verdict ? verdictBadge(m.verdict) : ''}
      </div>`;
    });
    inner += '</div><p style="margin-top: 14px; font-size: 12px; color: var(--text-muted)">Dashed lines mark the 20–35% pass band. Click any model name for its full profile across all 100 cases.</p>';
  } else if (key === 'heatmap') {
    inner = '<p class="prose" style="color: var(--text-muted); font-size: 13px; margin: 0 0 16px">Average score per sub-question (Q1 … Q8) across the 8 entities. Hover for the grader rationale.</p>';
    inner += '<div class="card" style="overflow-x: auto; padding: 0"><table class="tbl" style="font-size: 12px"><thead><tr><th style="min-width: 160px">Model</th>';
    qKeys.forEach(q => { inner += `<th style="text-align: center; min-width: 56px">${q}</th>`; });
    inner += '<th style="text-align: center; min-width: 64px; background: var(--accent-soft)">Avg</th></tr></thead><tbody>';
    models.sort((a, b) => (b.overall_pct ?? -1) - (a.overall_pct ?? -1)).forEach(m => {
      inner += `<tr><td><a href="model.html?slug=${m.slug}" style="font-weight: 500; color: var(--text)">${m.name}</a></td>`;
      qKeys.forEach(q => {
        const v = m.q_scores?.[q];
        if (!v) inner += '<td style="text-align: center; color: var(--text-faint)">—</td>';
        else inner += `<td style="padding: 4px" title="${(v.rationale || '').replace(/"/g, '&quot;')}"><div class="mono" style="background: ${scoreColor(v.avg)}; color: ${scoreTextColor(v.avg)}; padding: 6px 8px; font-weight: 700; font-size: 11px; text-align: center; border-radius: 3px">${v.avg.toFixed(0)}</div></td>`;
      });
      inner += `<td style="padding: 4px; background: var(--accent-soft)">${m.overall_pct != null ? `<div class="mono" style="padding: 6px; font-weight: 700; text-align: center; color: var(--accent-strong)">${m.overall_pct.toFixed(1)}</div>` : '<span style="color: var(--text-faint)">—</span>'}</td></tr>`;
    });
    inner += '</tbody></table></div>';
  } else if (key === 'answers') {
    inner = '<div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap"><span style="font-size: 13px; color: var(--text-muted)">Model:</span><select id="model-select" class="input" style="width: auto">';
    models.forEach((m, i) => { inner += `<option value="${i}">${m.name}${m.overall_pct != null ? ` — ${m.overall_pct.toFixed(1)}%` : ''}</option>`; });
    inner += '</select></div><div id="answer-detail"></div>';
  } else if (key === 'compare') {
    inner = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px">';
    inner += `<div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 6px">Model A</div><select id="cmp-a" class="input">${models.map((m, i) => `<option value="${i}"${i === 0 ? ' selected' : ''}>${m.name}${m.overall_pct != null ? ` — ${m.overall_pct.toFixed(1)}%` : ''}</option>`).join('')}</select></div>`;
    inner += `<div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 6px">Model B</div><select id="cmp-b" class="input">${models.map((m, i) => `<option value="${i}"${i === 1 ? ' selected' : ''}>${m.name}${m.overall_pct != null ? ` — ${m.overall_pct.toFixed(1)}%` : ''}</option>`).join('')}</select></div>`;
    inner += '</div><div id="compare-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px"></div>';
  } else if (key === 'reference') {
    inner = '<div class="card card-pad" style="background: var(--accent-soft); border-color: var(--accent); display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="10" stroke="var(--accent-strong)" stroke-width="1.6"/><circle cx="12" cy="12" r="6" stroke="var(--accent-strong)" stroke-width="1.6"/><circle cx="12" cy="12" r="2" fill="var(--accent-strong)"/></svg><div><div style="font-weight: 600; color: var(--accent-strong); margin-bottom: 4px; font-size: 13px">Reference answer</div><div style="font-size: 12.5px; color: var(--accent-strong)">Generated by Claude Opus 4.7 with derivation chains; audited by SourceVerifier (T1/T2/T3 classification).</div></div></div>';
    inner += `<div class="card card-pad-lg"><div class="markdown">${md(d.reference)}</div></div>`;
  } else if (key === 'rubric') {
    inner = '<div class="card card-pad" style="background: var(--accent-soft); border-color: var(--accent); display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0; margin-top: 1px"><rect x="3" y="6" width="18" height="4" fill="var(--accent-strong)"/><rect x="3" y="12" width="12" height="4" fill="var(--accent-strong)" opacity="0.7"/><rect x="3" y="18" width="6" height="4" fill="var(--accent-strong)" opacity="0.4"/></svg><div><div style="font-weight: 600; color: var(--accent-strong); margin-bottom: 4px; font-size: 13px">4-tier rubric</div><div style="font-size: 12.5px; color: var(--accent-strong)">Each (Q × entity) cell scored 1.0 / 0.5 / 0.25 / 0. Pass band target: 20–35%.</div></div></div>';
    inner += `<div class="card card-pad-lg"><div class="markdown">${md(d.rubric)}</div></div>`;
  } else if (key === 'try') {
    inner = '<p class="prose" style="color: var(--text-muted); font-size: 13px; margin: 0 0 24px">Copy the question to your own model, paste the answer back, and side-by-side compare with the reference or any of the 9 models. No automatic grading.</p>';
    inner += '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px">';
    inner += `<div class="card card-pad"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">1</span><span style="font-weight: 600">Copy the question</span></div><button id="copy-q" class="btn btn-primary" style="width: 100%; justify-content: center">Copy question text</button><details style="margin-top: 12px; font-size: 12px; color: var(--text-muted)"><summary style="cursor: pointer">View text</summary><textarea readonly class="input styled-scroll" style="height: 130px; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 8px; resize: vertical">${d.question.replace(/</g, '&lt;')}</textarea></details></div>`;
    inner += `<div class="card card-pad"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px"><span style="width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">2</span><span style="font-weight: 600">Paste your answer</span></div><textarea id="user-answer" class="input styled-scroll" style="height: 168px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; resize: vertical" placeholder="Paste your model's answer here…"></textarea></div>`;
    inner += '</div>';
    inner += '<div class="card card-pad"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px"><span style="width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">3</span><span style="font-weight: 600">Compare with reference or any model</span></div><div style="display: flex; flex-wrap: wrap; gap: 6px">';
    inner += `<button onclick="showCompare('reference')" class="btn btn-primary btn-sm">Reference</button>`;
    models.forEach((m, i) => { inner += `<button onclick="showCompare('m${i}')" class="btn btn-secondary btn-sm">${m.name}${m.overall_pct != null ? ` · ${m.overall_pct.toFixed(0)}%` : ''}</button>`; });
    inner += '</div><div id="compare-box" style="margin-top: 16px; display: none; padding: 18px; background: var(--bg-subtle); border: 1px solid var(--border-soft); border-radius: 4px; max-height: 540px; overflow-y: auto" class="styled-scroll"><div class="markdown"></div></div></div>';
  }

  // Wrap with tab bar
  document.getElementById('case-content').innerHTML = `
    <div class="tabs-row">
      ${CASE_TABS.map(t => `<button class="tab-btn ${t.key === key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>`).join('')}
    </div>
    ${inner}
  `;

  // Bind tab clicks
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => showCaseTab(btn.dataset.tab));
  });

  // Per-tab hooks
  if (key === 'answers') initAnswerTab();
  if (key === 'compare') initCompareTab();
  if (key === 'try') initTryTab();
}

function initAnswerTab() {
  const sel = document.getElementById('model-select');
  function showAnswer(idx) {
    const m = DATA.models[idx];
    const qScores = m.q_scores && Object.keys(m.q_scores).length;
    let perQ = '';
    if (qScores) {
      perQ = `<details class="card" style="margin-bottom: 16px; overflow: hidden"><summary style="padding: 12px 16px; cursor: pointer; font-weight: 600; font-size: 13px; background: var(--bg-subtle); user-select: none">Per-question scoring rationale (GPT-5.5)</summary><div style="border-top: 1px solid var(--border-soft)"><table class="tbl" style="font-size: 12.5px"><thead><tr><th style="width: 60px">Q</th><th style="width: 80px; text-align: right">Avg</th><th>Rationale</th></tr></thead><tbody>${Object.entries(m.q_scores).map(([k, v]) => `<tr><td class="mono" style="font-weight: 700; color: var(--accent)">${k}</td><td style="text-align: right"><span class="pill ${scoreClass(v.avg)}">${v.avg.toFixed(1)}%</span></td><td style="color: var(--text-muted); font-size: 12px; line-height: 1.6">${v.rationale || '—'}</td></tr>`).join('')}</tbody></table></div></details>`;
    }
    document.getElementById('answer-detail').innerHTML = `
      <div class="card card-pad-lg" style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
        <div>
          <a href="model.html?slug=${m.slug}" style="font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.01em">${m.name}</a>
          <div class="mono" style="font-size: 11px; color: var(--text-muted); margin-top: 4px">${m.elapsed_s ? `${m.elapsed_s.toFixed(0)}s` : ''}${m.elapsed_s && m.chars ? ' · ' : ''}${m.chars ? `${m.chars.toLocaleString()} chars` : ''}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          ${m.overall_pct != null ? `<span class="pill ${scoreClass(m.overall_pct)}" style="font-size: 14px; padding: 5px 12px">${m.overall_pct.toFixed(2)}%</span>` : '<span style="color: var(--text-faint)">—</span>'}
          ${m.verdict ? verdictBadge(m.verdict) : ''}
        </div>
      </div>
      ${perQ}
      <div class="card" style="overflow: hidden">
        <div style="padding: 11px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border-soft); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em">Full answer</div>
        <div class="markdown styled-scroll" style="padding: 24px; max-height: 640px; overflow-y: auto">${md(m.answer)}</div>
      </div>`;
  }
  sel.addEventListener('change', e => showAnswer(+e.target.value));
  showAnswer(0);
}

function initCompareTab() {
  function render() {
    const ai = +document.getElementById('cmp-a').value;
    const bi = +document.getElementById('cmp-b').value;
    document.getElementById('compare-grid').innerHTML = [ai, bi].map(i => {
      const m = DATA.models[i];
      return `<div class="card" style="overflow: hidden"><div style="padding: 14px 16px; background: var(--bg-subtle); border-bottom: 1px solid var(--border-soft)"><div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px"><a href="model.html?slug=${m.slug}" style="font-weight: 700; color: var(--text); font-size: 14px">${m.name}</a>${m.overall_pct != null ? `<span class="pill ${scoreClass(m.overall_pct)}">${m.overall_pct.toFixed(1)}%</span>` : ''}</div><div class="mono" style="font-size: 10px; color: var(--text-muted)">${m.elapsed_s ? `${m.elapsed_s.toFixed(0)}s · ` : ''}${m.chars ? `${m.chars.toLocaleString()} chars` : ''}</div></div><div class="markdown styled-scroll" style="padding: 18px; max-height: 640px; overflow-y: auto; font-size: 12.5px">${md(m.answer)}</div></div>`;
    }).join('');
  }
  document.getElementById('cmp-a').addEventListener('change', render);
  document.getElementById('cmp-b').addEventListener('change', render);
  render();
}

function initTryTab() {
  document.getElementById('copy-q').addEventListener('click', () => {
    navigator.clipboard.writeText(DATA.question).then(() => {
      const btn = document.getElementById('copy-q');
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = orig; }, 1200);
    });
  });
  window.showCompare = function(key) {
    const box = document.getElementById('compare-box');
    box.style.display = 'block';
    const text = key === 'reference' ? DATA.reference : DATA.models[+key.slice(1)].answer;
    box.querySelector('.markdown').innerHTML = md(text);
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
}

const caseId = getParam('id');
if (!caseId) {
  document.getElementById('root').innerHTML = `<div class="container" style="padding: 64px 0; text-align: center"><p style="color: var(--text-muted); margin-bottom: 16px">No case specified.</p><a href="index.html#browse" class="btn btn-primary">← Back to catalog</a></div>`;
} else {
  Promise.all([
    fetch('data/per_case/' + caseId + '.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    fetch('data/cases.json').then(r => r.json()),
  ]).then(([d, cases]) => {
    DATA = d;
    initCmdK(cases);
    document.getElementById('root').innerHTML = `${renderHero(d)}<section style="padding: 0 0 56px"><div class="container"><div id="case-content"></div></div></section>`;
    showCaseTab('question');
  }).catch(e => {
    document.getElementById('root').innerHTML = `<div class="container" style="padding: 64px 0; text-align: center"><p style="color: var(--hard); margin-bottom: 16px">Failed to load: ${e.message}</p><a href="index.html#browse" class="btn btn-primary">← Back to catalog</a></div>`;
  });
}
</script>
</body>
</html>
