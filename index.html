/* ─────────── Hero matrix: paper's 8×8 figure 1(a) ─────────── */
function buildHeroMatrix() {
  // Approximate cell values from Figure 1(a): rows = 8 entities, cols = 8 dimensions (D1=R, D2-5=D, D6=Cal, D7-8=Reas)
  // Pattern: brighter green = higher score
  const seed = [
    [1.0, 0.5, 1.0, 0.5, 0.5, 1.0, 0.5, 0.5],
    [0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.25, 0.5],
    [0.5, 0.5, 0.25, 0.5, 0.5, 0.5, 0.25, 0.5],
    [0.25, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5, 0.25],
    [0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.5, 0.25],
    [1.0, 0.5, 0, 0.5, null, 0.5, 0, 0.5],
    [0.5, 0.5, 0.25, 0.5, 0.5, 0.25, 0.5, 0.5],
    [0.25, 0.5, 0.5, 0.25, 0.5, 0.5, 0.25, 0.5],
  ];
  const cellColor = v => {
    if (v === null) return 'var(--bg-subtle)';      // N/A
    if (v === 1) return 'var(--accent)';
    if (v === 0.5) return 'var(--accent-soft)';
    if (v === 0.25) return '#f4f1ea';
    return '#fee2e2'; // 0
  };
  const cellText = v => v === null ? 'N/A' : v === 1 ? '1.0' : v === 0.5 ? '0.5' : v === 0.25 ? '0.25' : '0';
  let html = '';
  seed.forEach(row => row.forEach(v => {
    html += `<div class="hero-matrix-cell" style="background: ${cellColor(v)}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; color: ${v === 1 ? '#fff' : 'var(--text-muted)'}">${cellText(v)}</div>`;
  }));
  return html;
}

function renderMethodPage() {

          <p style="color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin: 0 0 24px">
            Every cell carries a reference answer (with type, central value, unit, derivation), a list of supporting sources (each tagged with T1–T4 provenance and a verification verdict), a cross-source agreement flag (<code>consistent</code> / <code>divergent</code> / <code>single</code>), and a per-cell scoring rule.

              <tbody>

                <tr><td><span class="mono">02</span></td><td><strong style="color: var(--text)">Dimension Design</strong></td><td>8 dimensions following the 1/4/1/2 capability-family split, with metric specifications</td></tr>
                <tr><td><span class="mono">03</span></td><td><strong style="color: var(--text)">Reference Construction</strong></td><td>Per-cell reference: derivation chain, T1–T4 source list, cross-source agreement</td></tr>

/* ─────────── Data-bound renderers ─────────── */

function renderLBMini() {
  // Use paper Table 1 numbers
  const rows = PAPER.table1.filter(r => r.rank);
  // Find best per column
  const bestByCol = {};
  ['overall', 'retrieval', 'derivation', 'calibration', 'reasoning'].forEach(c => {
    bestByCol[c] = Math.max(...rows.map(r => r[c]));
  });
  document.getElementById('lb-mini-body').innerHTML = rows.map(r => {
    const link = r.slug ? `<a href="model.html?slug=${r.slug}" style="color: var(--text); font-weight: 500">${r.model}</a>` : r.model;
    const tdScore = (k) => {
      const v = r[k];
      const isBest = v === bestByCol[k];
      return `<td class="mono ${isBest ? 'best-score' : ''}" style="text-align: right">${v.toFixed(2)}<span style="color: var(--text-muted)">%</span></td>`;
    };
    return `
      <tr>
        <td><span class="mono" style="color: var(--text-muted)">${r.rank.toString().padStart(2, '0')}</span></td>
        <td>${link}</td>
        ${tdScore('overall')}
        ${tdScore('retrieval')}
        ${tdScore('derivation')}
        ${tdScore('calibration')}
        ${tdScore('reasoning')}
      </tr>`;
  }).join('');
}

function renderCorrMatrix(containerId) {
  const labels = PAPER.correlation_matrix._label_order;
  const vals = PAPER.correlation_matrix.values;
  let html = '<table style="border-collapse: collapse; width: 100%; max-width: 540px"><thead><tr><th style="background: transparent"></th>';
  labels.forEach(l => { html += `<th style="font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 6px; text-align: center; color: var(--text-muted); font-weight: 600">${l}</th>`; });
  html += '</tr></thead><tbody>';
  vals.forEach((row, i) => {
    html += `<tr><td style="font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 6px; text-align: right; color: var(--text-muted); font-weight: 600">${labels[i]}</td>`;
    row.forEach((v, j) => {
      if (i === j) {
        html += `<td class="corr-cell" style="background: var(--text); color: white">${v.toFixed(2)}</td>`;
      } else {
        const t = (v - 0.3) / 0.6;
        const bg = `hsl(${174 - 30 * (1-t)}, ${30 + 30*t}%, ${94 - 30*t}%)`;
        const fg = v > 0.7 ? '#fff' : 'var(--text)';
        html += `<td class="corr-cell" style="background: ${bg}; color: ${fg}">${v.toFixed(2)}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += '<p style="font-size: 11px; color: var(--text-muted); margin: 10px 0 0">Diagonal omitted. Mean off-diagonal ρ = <strong>' + PAPER.correlation_matrix.mean_off_diagonal + '</strong>.</p>';
  document.getElementById(containerId).innerHTML = html;
}

function renderFailureTable() {
  const fm = PAPER.failure_modes;
  const modes = [
    ['Hallucinated precision', 'hallucinated_precision', 'hard'],
    ['Silent source choice', 'silent_source_choice', 'neutral'],
    ['Incomplete derivation', 'incomplete_derivation', 'easy'],
    ['Scope drift', 'scope_drift', 'neutral'],
    ['Retrieval gap', 'retrieval_gap', 'pass'],
  ];
  document.getElementById('failure-table').innerHTML = `
    <thead>
      <tr>
        <th>Failure mode</th>
        <th style="width: 110px; text-align: right">Top-4</th>
        <th style="width: 110px; text-align: right">Other 5</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>
      ${modes.map(([label, key]) => {
        const a = fm.top4[key], b = fm.other5[key];
        const dom = Math.max(a, b);
        const winner = a > b ? 'Top-4' : 'Other 5';
        return `<tr>
          <td><strong>${label}</strong></td>
          <td class="mono" style="text-align: right ${a === Math.max(...modes.map(m => fm.top4[m[1]])) ? '; color: var(--text); font-weight: 700' : '; color: var(--text-muted)'}">${a}%</td>
          <td class="mono" style="text-align: right ${b === Math.max(...modes.map(m => fm.other5[m[1]])) ? '; color: var(--text); font-weight: 700' : '; color: var(--text-muted)'}">${b}%</td>
          <td style="font-size: 12px; color: var(--text-muted)">${
            key === 'incomplete_derivation' ? 'Dominant for strong models — composition step misapplied.' :
            key === 'hallucinated_precision' ? 'Dominant for weak models — confident precise number without authoritative source.' :
            key === 'silent_source_choice' ? 'Picks one source without disclosing alternatives or conflicts.' :
            key === 'scope_drift' ? 'Wrong unit / fiscal period / aggregation level.' :
            'Could not locate publicly indexable authoritative source.'}
          </td>
        </tr>`;
      }).join('')}
    </tbody>
  `;
}

function renderDomainDistribution() {
  const dist = PAPER.dataset_stats.domain_distribution;
  const maxN = Math.max(...dist.map(d => d.n_tasks));
  document.getElementById('domain-distribution').innerHTML = `
    <div style="display: flex; flex-direction: column; gap: 10px">
      ${dist.map(d => `
        <div>
          <div style="display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px">
            <span style="font-weight: 500; color: var(--text)">${d.domain}</span>
            <span class="mono" style="color: var(--text-muted)">${d.n_tasks}</span>
          </div>
          <div style="height: 8px; background: var(--bg-subtle); border-radius: 4px; overflow: hidden">

function renderBrowse() {
  const q = document.getElementById('browse-search').value.toLowerCase().trim();
  const sort = document.getElementById('browse-sort').value;
  let filtered = CASES.filter(c => !q || (c.case_id + ' ' + c.title + ' ' + c.domain + ' ' + c.entities.join(' ')).toLowerCase().includes(q));
  if (sort === 'hardest') filtered.sort((a, b) => (a.max_score ?? 999) - (b.max_score ?? 999));
  else if (sort === 'easiest') filtered.sort((a, b) => (b.max_score ?? -1) - (a.max_score ?? -1));
  else if (sort === 'spread') filtered.sort((a, b) => ((b.max_score ?? 0) - (b.min_score ?? 0)) - ((a.max_score ?? 0) - (a.min_score ?? 0)));
  else filtered.sort((a, b) => a.case_id.localeCompare(b.case_id));

  document.getElementById('browse-count').textContent = `${filtered.length} of ${CASES.length} tasks`;
  const grid = document.getElementById('browse-grid');
  if (!filtered.length) { grid.innerHTML = '<div style="grid-column: 1/-1; padding: 32px; text-align: center; color: var(--text-muted)">No matching tasks.</div>'; return; }
  grid.innerHTML = filtered.map(c => {
    const num = (c.case_id.match(/^(\d+)_/) || ['', '?'])[1];
    return `
      <a href="case.html?id=${encodeURIComponent(c.case_id)}" class="case-card animate-slide-up">
        <div class="case-card-id">task · ${num}</div>
        <div class="case-card-title">${c.domain || c.title}</div>
        <div class="case-card-entities">${c.entities.slice(0, 4).join(' · ')}${c.entities.length > 4 ? ' …' : ''}</div>
        <div class="case-card-foot">
          <span>${c.n_entities} ent · ${c.models_scored}/9</span>
          ${c.avg_score != null ? `<span class="pill ${scoreClass(c.avg_score)}">${c.avg_score.toFixed(1)}%</span>` : ''}
        </div>
      </a>`;
  }).join('');
}

function renderHeatmap() {
  let html = '<table style="border-collapse: collapse"><thead><tr>';
  html += `<th style="position: sticky; left: 0; background: var(--bg-card); padding: 8px 10px; text-align: left; color: var(--text-muted); min-width: 160px; z-index: 2; border-bottom: 1px solid var(--border-soft); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Task</th>`;
  LB.models.forEach(m => {
    html += `<th style="padding: 4px 2px; text-align: center; color: var(--text); font-weight: 600; writing-mode: vertical-rl; transform: rotate(180deg); height: 96px; min-width: 38px; font-size: 10px; border-bottom: 1px solid var(--border-soft)"><a href="model.html?slug=${m.slug}" style="color: var(--text)">${m.name}</a></th>`;
  });
  html += '</tr></thead><tbody>';
  CASES.slice().sort((a,b) => a.case_id.localeCompare(b.case_id)).forEach(c => {
    html += '<tr>';
    html += `<td style="position: sticky; left: 0; background: var(--bg-card); padding: 4px 10px; border-bottom: 1px solid var(--border-faint); max-width: 180px"><a href="case.html?id=${encodeURIComponent(c.case_id)}" style="color: var(--text); font-size: 11px">${c.case_id.replace(/^\d+_/, '').replace(/_/g, ' ')}</a></td>`;
    LB.models.forEach(m => {
      const s = m.per_case[c.case_id];
      if (s == null) html += `<td class="matrix-cell" style="background: var(--bg-subtle); color: var(--text-faint); border-bottom: 1px solid var(--border-faint)">—</td>`;
      else html += `<td class="matrix-cell" style="background: ${scoreColor(s)}; color: ${scoreTextColor(s)}; border-bottom: 1px solid var(--border-faint)" title="${c.title} · ${m.name}: ${s.toFixed(1)}%">${s.toFixed(0)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('heatmap').innerHTML = html;
}

/* ─────────── Tab switcher ─────────── */
function showTab(key, push = true) {
  const page = document.getElementById('page');
  document.querySelectorAll('.topbar-link').forEach(l => {
    const k = l.getAttribute('href').split('#')[1] || 'home';
    l.classList.toggle('active', k === key);
  });

  if (key === 'home') page.innerHTML = renderHome();
  else if (key === 'leaderboard') page.innerHTML = renderLeaderboardPage();
  else if (key === 'browse') page.innerHTML = renderBrowsePage();
  else if (key === 'method') page.innerHTML = renderMethodPage();
  else if (key === 'findings') page.innerHTML = renderFindingsPage();

  if (key === 'home') {
    if (PAPER) renderLBMini();
    if (PAPER) renderDomainDistribution();
  } else if (key === 'leaderboard') {
    if (PAPER) {
      renderLBFull();
      renderCapabilityChart();
      renderCorrMatrix('corr-matrix');
      if (LB && CASES.length) renderHeatmap();
    }
  } else if (key === 'browse') {
    if (CASES.length) {
      renderBrowse();
      document.getElementById('browse-search').addEventListener('input', renderBrowse);
      document.getElementById('browse-sort').addEventListener('change', renderBrowse);
    }
  } else if (key === 'findings') {
    if (PAPER) {
      renderFailureTable();
      renderCorrMatrix('corr-matrix-2');
    }
  }

  document.querySelectorAll('.tablink').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const k = a.dataset.tab;
      location.hash = '#' + k;
      showTab(k);
    });
  });

  if (push) history.replaceState(null, '', '#' + key);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ─────────── Init ─────────── */
const startTab = getInitialPage();
Promise.all([
  fetch('data/cases.json').then(r => r.json()),
  fetch('data/leaderboard.json').then(r => r.json()),
  fetch('data/paper_results.json').then(r => r.json()),
]).then(([cases, lb, paper]) => {
  CASES = cases;
  LB = lb;
  PAPER = paper;
  initCmdK(cases);
  showTab(startTab);
}).catch(e => {
  document.getElementById('page').innerHTML = `<div class="container" style="padding: 64px 0; text-align: center; color: var(--hard)">Failed to load: ${e.message}</div>`;
});

window.addEventListener('hashchange', () => {
  const k = location.hash.replace('#', '') || 'home';
  if (['home', 'leaderboard', 'browse', 'method', 'findings'].includes(k)) showTab(k, false);
});
